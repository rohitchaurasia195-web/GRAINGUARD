version: 2

models:
  - name: stg_orders
    columns:
      - name: order_id
        data_tests: [unique, not_null]
  - name: stg_payments
    columns:
      - name: payment_id
        data_tests: [unique, not_null]
  - name: stg_customers
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
  - name: stg_support_tickets
    columns:
      - name: ticket_id
        data_tests: [unique]
